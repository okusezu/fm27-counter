<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spygate - Your FM27 Assistant Manager</title>
<style>
/* Terminal look, same Omarchy palette as the staff tool. */
:root{--bg:#05182e;--bg-lift:#0a2540;--ink:#f6dcac;--soft:#a7c9c6;--muted:#5f9ea3;--line:#2a6b78;--accent:#faa968;--warn:#e97b3c;--cyan:#8cbfb8;
  --mono:"JetBrainsMono Nerd Font","JetBrainsMono NF","JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;color:var(--ink);font:13px/1.5 var(--mono)}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;max-width:1200px;margin:0 auto;padding:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
h1{font-size:15px;margin:0 0 12px;color:var(--accent)}
h2{font-size:14px;margin:0 0 4px;color:var(--accent)}
h3{font-size:13px;margin:14px 0 4px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.box{border:1px solid var(--line);background:var(--bg-lift);padding:12px 14px}
label{display:block;margin:0 0 10px;color:var(--soft)}
select{display:block;width:100%;margin-top:3px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:4px;font:inherit}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{accent-color:var(--accent);margin-top:3px}
ul{margin:0;padding-left:18px}li{margin:2px 0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cols.two{grid-template-columns:repeat(2,1fr)}.cols.two>div{border:1px solid var(--line);background:var(--bg);padding:6px 12px}.cols.two h3{margin-top:4px}
@media(max-width:1000px){.cols,.cols.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:400}
.why{color:var(--muted)}.warn{color:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tab{flex:0 0 auto;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg);color:var(--soft);padding:6px 8px;margin-bottom:-1px;white-space:nowrap;font-size:12px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--bg-lift);color:var(--accent);position:relative;z-index:1}
.tab .sc{color:var(--muted);margin-left:6px;font-size:11px}
.box.tabbed{border-top-left-radius:0}
button{font:inherit;background:none;border:1px solid var(--line);color:var(--accent);padding:2px 8px;cursor:pointer}
.tag{color:var(--bg);background:var(--accent);padding:0 6px;margin-right:6px}
h3.big{font-size:16px;color:var(--accent);margin-top:0}
.oppo{font-size:20px;font-weight:700;letter-spacing:.06em;margin:0 0 10px}
.shape{border:1px solid var(--line);background:var(--bg);padding:6px 10px;margin:4px 0 8px}
.shape span{display:block;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.shape b{font-size:18px;color:var(--accent)}
.shape small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.shape small ul{margin:2px 0 0;padding-left:16px}
#out{display:grid;gap:16px;align-content:start;min-width:0}
#out>div{min-width:0} /* let the tab bar scroll instead of widening the page */
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<form id="form" onsubmit="return false">
<div class="box" style="margin-bottom:16px">
  <h1>Spygate - Your FM27 Assistant Manager</h1>
  <button type="button" id="bgToggle" aria-pressed="true" style="margin:-4px 0 0">Background animation: on</button>
</div>
<div class="box">
  <h2 class="oppo">OPPOSITION PLAYSTYLE</h2>
  <label>Their formation (in possession)<select name="formation"></select></label>
  <label>Their formation (out of possession)<select name="oopShape"></select></label>
  <label>Their mentality<select name="mentality">
    <option value="defensive">Defensive / Cautious</option><option value="balanced" selected>Balanced</option><option value="attacking">Attacking</option></select></label>
  <label>Their style<select name="style">
    <option value="unknown">Not sure</option><option value="possession">Control possession (short passing, high full-backs)</option>
    <option value="through">Plays through the press, works ball into box</option><option value="direct">Direct / long ball</option>
    <option value="counter">Sits deep and counters</option><option value="wing">Wing play (wingers + overlapping full-backs, crosses)</option><option value="tiki">Tiki-Taka (much shorter passing, high press, higher line)</option></select></label>
  <label>Their pressing<select name="press"><option value="low">Low</option><option value="mid" selected>Mid</option><option value="high">High</option></select></label>
  <label>Their defensive line<select name="line"><option value="deep">Deep</option><option value="standard" selected>Standard</option><option value="high">High</option></select></label>
  <label>Compared to you, they are<select name="strength"><option value="weaker">Weaker</option><option value="even" selected>About even</option><option value="stronger">Stronger</option></select></label>
  <label>Home or away?<select name="venue"><option value="">Not sure</option><option value="home">Home</option><option value="away">Away</option></select></label>
  <div id="scout"></div>
  <h3>Your squad</h3>
  <label class="chk"><input type="checkbox" name="canPress">Most of my players have Work Rate + Stamina 14+</label>
</div>
</form>
<section id="out"></section>
</main>

  '5-3-2':{weak:SHAPES['5-3-2'].weak,ip:'4-3-3 or 3-4-2-1 - wide players attack the space in front of their wing-backs',
    tips:['Go round their three central midfielders, not through them','Get your wingers on the ball in front of their wing-backs','Overlaps turn it into 2v1s on the flank'],
    set:{'Attacking Width':'Wider','Supporting Runs':'Both Flanks'}},
};
// Central players per shape; 4-4-1-1 is the only OOP shape not in SHAPES.
const MID={...Object.fromEntries(Object.entries(SHAPES).map(([k,v])=>[k,v.mid])),'4-4-1-1':3};
// Extra settings for this opponent; they override the plan. Entries with `ask` become scout-report
// questions on the form: a tick box, or a dropdown when several entries share a key with a `value`.
// own:true = worked out here, not from the cheat sheets.
const TWEAKS=[
  {when:o=>o.press==='high',text:'Buildup Strategy: Bypass press',why:'They press high',set:{'Build-Up Strategy':'Bypass Press'}},
  {when:o=>o.line==='high',text:'Pass Reception: into space behind their line; ST as Channel Forward',why:'They play a high line',set:{'Pass Reception':'Pass Into Space'}},
  {when:o=>o.strength==='stronger',text:'Mentality one notch lower; consider Low Block with 5-4-1 OOP',why:'Stronger opponent (5-4-1: protecting a lead, stronger opponents)',mood:-1},
  {when:o=>o.strength==='weaker',text:'Mentality one notch higher',why:'Weaker opponent',own:true,mood:1},
  // Home/away: FM community advice (FM24-FM26 guides), nothing FM27-specific yet.
  {when:o=>o.venue==='home',text:'Mentality: your usual setting, or a notch higher - expect more of the ball at home',why:'Home',own:true},
  {when:o=>o.venue==='away'&&o.strength!=='weaker',text:'Mentality one notch lower than at home (e.g. Positive to Balanced, Balanced to Cautious); stay on your feet',why:'Away from home',own:true,mood:-1,set:{'Tackling':'Stay On Feet'}},
  {when:o=>o.venue==='away'&&o.strength==='weaker',text:'Away to a weaker side: keep your usual mentality - no need to drop a notch',why:'Away, but they are weaker',own:true},
  // ---- scout report ----
  {key:'goalsFrom',value:'crosses',ask:'Where do they score most of their goals from?',label:'Crosses',
    text:'Stop the crosses: Cross Engagement: Stop Crosses, Pressing Trap inside - away from the touchline; wide players track back',why:'They score from crosses',own:true,
    set:{'Cross Engagement':'Stop Crosses','Pressing Trap':'Trap Inside'}},
  {key:'goalsFrom',value:'middle',ask:'Where do they score most of their goals from?',label:'Through the middle',
    text:'Close the shooting space: Defensive Line Behaviour step up; Pressing Trap outside - force them wide',why:'They score through the middle',own:true,
    set:{'Defensive Line Behaviour':'Step Up','Pressing Trap':'Trap Outside'}},
  {key:'concedeFrom',value:'crosses',ask:'Where do they concede most of their goals from?',label:'Crosses',
    text:'Attack them wide: Attacking Width wider, Supporting Runs both flanks - get the ball into the box from the flanks',why:'They concede from crosses',own:true,
    set:{'Attacking Width':'Wider','Supporting Runs':'Both Flanks'}},
  {key:'concedeFrom',value:'middle',ask:'Where do they concede most of their goals from?',label:'Through the middle',
    text:'Go through the middle: Attacking Width narrower, Patience - work the ball into the box',why:'They concede through the middle',own:true,
    set:{'Attacking Width':'Narrower','Patience':'Work Ball Into Box'}},
  {key:'setPieces',ask:'Vulnerable at set pieces',text:'Play for Set Pieces: win corners and free kicks; tall players on corners, one on the edge of the box',
    why:'Vulnerable at set pieces',set:{'Play for Set Pieces':'Play for Set Pieces'}},
  {key:'weakAir',ask:'Weak in the air',text:'Crossing Style: Floated Crosses; a Target Forward to attack them',why:'Weak in the air',own:true,set:{'Crossing Style':'Floated Crosses'}},
  {key:'strongAir',ask:'Strong in the air',text:"Crossing Style: Low Crosses - don't float it to their centre-backs",why:'Strong in the air',own:true,set:{'Crossing Style':'Low Crosses'}},
  {key:'slowDef',ask:'Slow defenders',text:'Balls in behind: Pass Reception into space, more direct, ST as Channel Forward; two strikers trouble slow CBs',
    why:'Slow defenders (formation sheet: 4-4-2 vs slow CBs)',set:{'Pass Reception':'Pass Into Space','Passing Directness':'More Direct'}},
  {key:'counterVuln',ask:'Vulnerable to counter-attacks',text:'Attacking Transition: counter-attack the moment you win it',why:'Vulnerable to counter-attacks',own:true,set:{'Attacking Transition':'Counter-Attack'}},
  {key:'longShots',ask:'Concede from long shots / weak goalkeeper',text:'Shots From Distance: Encourage - only with good Long Shots',why:'Concede from distance',own:true,set:{'Shots From Distance':'Encourage'}},
  {key:'fouls',ask:'Give away a lot of fouls',text:'Dribbling: Encourage - run at them and draw fouls near the box',why:'Ill-disciplined',own:true,set:{'Dribbling':'Encourage'}},
  {key:'lateGoals',ask:'Concede late goals',text:'After 70 min: raise mentality a notch and bring on fresh legs',why:'Concede late',own:true},
  {key:'dribblers',ask:'Their forwards dribble well',text:'Tackling: Stay On Feet',why:'Their forwards dribble well',set:{'Tackling':'Stay On Feet'}},
  {key:'weakPassers',ask:'Back line / GK weak on the ball',text:'Short Goalkeeper Distribution: prevent it; Pressing Traps toward their weaker passers',
    why:'Weak on the ball at the back (4-3-3 high press OOP targets this)',set:{'Short Goalkeeper Distribution':'Yes'}},
];
const tweakOn=(t,o)=>t.when?t.when(o):t.value?o[t.key]===t.value:!!o[t.key];

// ---------- engine ----------
function score(o){
  const s=Object.fromEntries(Object.keys(PLANS).map(k=>[k,[]]));
  const add=(k,n,why)=>(k==='possession'?['possessionA','possessionB']:[k]).forEach(x=>s[x].push([n,why]));
  if(o.style==='wing')add('wing',4,'Wing play: wingers, overlapping full-backs and crosses');
  if(o.style==='tiki'){add('tiki',5,'Tiki-Taka: extreme control possession with a high press');add('possession',2,'Tiki-Taka is a Control Possession variant');}
  if(o.mentality==='attacking')add('attacking',3,'Attacking mentality');
  if(['4-2-4','2-3-5','3-4-3','4-4-2'].includes(o.formation))add('attacking',2,`${o.formation} commits players forward`);
  if(o.style==='direct')add('attacking',2,'Direct play: lower line, screen the strikers, counter');
  if(o.mentality==='defensive')add('cautious',3,'Defensive / cautious mentality');
  if(['5-4-1','5-3-2'].includes(o.formation))add('cautious',2,`${o.formation} is a deep block`);
  if(o.style==='counter')add('cautious',2,'Sits deep and waits for the break');
  if(o.line==='deep')add('cautious',1,'Deep defensive line');
  if(o.style==='possession')add('possession',4,'Control-possession style');
  if(o.line==='high')add('possession',1,'High defensive line to play in behind');
  if(o.press==='high'&&o.style!=='through')add('possession',1,'High press: bypass it and counter');
  if(o.style==='through')add('through',4,'Plays through the press into the box');
  if(o.style==='unknown'&&o.mentality==='balanced')add('through',1,'No clear style: mid block and counter is the safe default');
  return Object.entries(s).map(([k,r])=>({key:k,total:r.reduce((a,x)=>a+x[0],0),reasons:r.map(x=>x[1])}))
    .sort((a,b)=>b.total-a.total);
}
function recommend(o,force){
  const ranked=score(o);
  let plan=force||ranked[0].key;
  // Possession A or B: the sheet's rule of thumb (Work Rate + Stamina 14+ -> press), never press a stronger side.
  if(!force&&plan.startsWith('possession'))plan=o.canPress&&o.strength!=='stronger'?'possessionB':'possessionA';
  const tweaks=TWEAKS.filter(t=>tweakOn(t,o));
  const shape=SHAPES[o.formation],oop=PLANS[plan].oop;
  const warns=[[oop,'plan'],[shape.oop,'shape counter']].filter(([f])=>MID[f]<shape.mid)
    .map(([f,w])=>`Count the middle: ${w} OOP ${f} has ${MID[f]} central players vs their ${shape.mid}`);
  const oopC=OOPS[o.oopShape]||null;
  // Layered lowest to highest; every override is reported.
  const layers=[['shape counter',oopC?.set],['plan',SETS[plan]],...tweaks.map(t=>[t.why,t.set])],set={},from={},clashes=[];
  for(const[who,s]of layers)for(const[k,v]of Object.entries(s||{})){
    if(k in set&&set[k]!==v)clashes.push(`${k}: ${v} (${who}) replaces ${set[k]} (${from[k]})`);
    set[k]=v;from[k]=who;
  }
  // Your shapes against them: attack their OOP shape (if known), defend against their IP shape.
  // Notes as dot points: one per clause of the sheet's reason.
  const dots=(head,why)=>[head,...why.split(/: |; |, /).map(x=>x.replace(/^and /,''))];
  const mine={ip:oopC?oopC.ip.split(' - ')[0]:shape.ip,ipWhy:oopC?dots(`vs their ${o.oopShape} out of possession`,oopC.ip.split(' - ')[1]||oopC.weak):dots(`vs their ${o.formation}`,shape.why),
    oop:shape.oop,oopWhy:dots(`vs their ${o.formation} in possession`,shape.why)};
  const moodT=tweaks.filter(t=>t.mood);
  const m=PLAN_MOOD[plan]+moodT.reduce((n,t)=>n+t.mood,0);
  // Never Very Defensive before kick-off (user): it rarely gets a result; only late on, holding a lead or a player down.
  mine.mood=MOODS[Math.max(1,Math.min(4,m))];
  mine.moodWhy=[PLANS[plan].shape[0].replace(/,.*$/,''),...moodT.map(t=>`${t.why}: ${t.mood>0?'+':''}${t.mood}`),
    ...(m<1?['Very Defensive only late on when holding a lead or down to 10 men']:[])].join(' · ');
  return {plan,reasons:ranked.find(r=>r.key===plan).reasons,ranked,tweaks,shape,oop,warns,set,oopC,clashes,mine};
}
</script>
<script id="ui">
const form=document.getElementById('form'),out=document.getElementById('out');
const KEY='fm27counter.inputs';let force=null;
form.formation.innerHTML=Object.entries(SHAPES).map(([f,x])=>`<option value="${f}">${x.label||f}</option>`).join('');
// Scout-report questions come from TWEAKS: shared key + value -> dropdown, otherwise a tick box.
const asks={};for(const t of TWEAKS)if(t.ask)(asks[t.key]??=[]).push(t);
document.getElementById('scout').innerHTML='<h3>Scout report</h3>'+Object.entries(asks).map(([k,ts])=>ts[0].value
  ?`<label>${ts[0].ask}<select name="${k}"><option value="">Not sure</option>${ts.map(t=>`<option value="${t.value}">${t.label}</option>`).join('')}</select></label>`
  :`<label class="chk"><input type="checkbox" name="${k}">${ts[0].ask}</label>`).join('');
form.oopShape.innerHTML='<option value="">Not sure</option>'+Object.keys(OOPS).map(f=>`<option>${f}</option>`).join('');
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
  for(const[k,v]of Object.entries(saved))if(form[k])form[k].type==='checkbox'?form[k].checked=v:form[k].value=v;}catch{}
const read=()=>Object.fromEntries([...form.querySelectorAll('select,input')].map(e=>[e.name,e.type==='checkbox'?e.checked:e.value]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const li=(x,cls)=>`<li${cls?` class="${cls}"`:''}>${esc(x)}</li>`;
const ul=(l,cls)=>`<ul>${l.map(x=>li(x,cls)).join('')}</ul>`;
function render(){
  const o=read();try{localStorage.setItem(KEY,JSON.stringify(o));}catch{}
  const r=recommend(o,force),P=PLANS[r.plan],auto=force?recommend(o).plan:r.plan;
  const score=Object.fromEntries(r.ranked.map(x=>[x.key,x.total]));
  // Firefox-style tabs, fixed order; ★ = the tool's pick, clicking it goes back to automatic.
  out.innerHTML=`<div><nav class="tabs" role="tablist" aria-label="Counter plans">${Object.keys(PLANS).map(k=>
    `<button class="tab" role="tab" aria-selected="${k===r.plan}" data-plan="${k===auto?'':k}">${k===auto?'★ ':''}${esc(PLANS[k].tab)}<span class="sc">${score[k]}</span></button>`).join('')}</nav>
  <div class="box tabbed">
    <h2 class="oppo">ASSESSING THE OPPOSITION&#39;S WEAKNESS</h2>
    <h2>${P.name}</h2>
    <p>${esc(P.blurb)}</p>
    ${P.own?'<p class="warn">Not from the cheat sheets: worked out here, so test it in a friendly first.</p>':''}
    <p class="why">Why: ${r.reasons.length?esc(r.reasons.join(' · ')):'picked manually'}</p>
    <h3>Their ${esc(o.formation)}</h3>
    <ul>${li('Weak spot: '+r.shape.weak)}${li(`Shape counter: IP ${r.shape.ip} / OOP ${r.shape.oop} - ${r.shape.why}`)}${r.warns.map(w=>li(w,'warn')).join('')}</ul>
    ${r.oopC?`<h3>Their ${esc(o.oopShape)} out of possession</h3>
    <p class="warn">Weak spot from the formation cheat sheet; how to attack it is worked out here, not from the cheat sheets.</p>
    <ul>${li('Weak spot: '+r.oopC.weak)}${li('Attack it with: '+r.oopC.ip)}${r.oopC.tips.map(t=>li(t)).join('')}
      ${li('Settings added to the setup sheet: '+Object.entries(r.oopC.set).map(([k,v])=>k+' '+v).join(', '),'why')}</ul>`:''}
  </div></div>
  ${r.tweaks.length||r.clashes.length?`<div class="box">
    ${r.tweaks.length?`<h3 class="big" style="font-size:20px">Tweaks for this opponent</h3><ul>${r.tweaks.map(t=>`<li>${esc(t.text)} <span class="why">- ${esc(t.why)}${t.own?' (not from the cheat sheets)':''}</span></li>`).join('')}</ul>`:''}
    ${r.clashes.length?`<h3>Overrides on the setup sheet</h3>${ul(r.clashes,'warn')}`:''}
  </div>`:''}
  <div class="box">
    <h3 class="big" style="font-size:20px">YOUR MENTALITY AND SHAPE</h3>
        <div class="shape"><span>Team mentality</span><b>${esc(r.mine.mood)}</b><small>${esc(r.mine.moodWhy)}</small></div>
        <div class="shape"><span>In possession shape</span><b>${esc(r.mine.ip)}</b><small>${ul(r.mine.ipWhy)}</small></div>
        <div class="shape"><span>Out of possession shape</span><b>${esc(r.mine.oop)}</b><small>${ul(r.mine.oopWhy)}</small></div>
  </div>
  <div class="box">
    <h3 class="big" style="font-size:20px">IN POSSESSION AND OUT OF POSSESSION TIPS</h3>
    <div class="cols two">
      <div><h3>In possession</h3>${ul(P.ip)}</div>
      <div><h3>Out of possession</h3>${ul(P.oopI)}</div>
    </div>
    <h3>In-game adjustments</h3>${ul(P.adjust)}
  </div>
  <div class="box">
    <h3 class="big" style="font-size:20px">SETUP SHEET: YOUR TEAM INSTRUCTIONS</h3>
    <p class="why">Highlighted = set this. Dim row = leave the default.</p>
    <table><tr><th>Phase</th><th>Instruction</th><th>Options</th></tr>
      ${TI.map(t=>{const s=r.set[t.name];return `<tr class="${s?'':'why'}"><td>${t.phase}</td><td>${t.name}</td>
        <td>${t.opts.map(x=>x===s?`<span class="tag">${x}</span>`:x).join(' · ')}</td></tr>`;}).join('')}</table>
    <p class="why">Where a setting is a direction (higher, lower), pick the matching notch in game.</p>
  </div>`;
}
form.addEventListener('change',()=>{force=null;render();});
out.addEventListener('click',e=>{const b=e.target.closest('[data-plan]');if(b){force=b.dataset.plan||null;render();}});
render();
</script>
<script>
// Background: soccer balls drifting on a character grid, leaving sparkles. ~12fps for a terminal feel.
(()=>{
  const cv=document.getElementById('bg'),g=cv.getContext('2d'),css=getComputedStyle(document.documentElement);
  const C=['--ink','--accent','--cyan'].map(v=>css.getPropertyValue(v).trim());
  const SPARK=['*','×','+','·'],FS=14,LIFE=SPARK.length*3;
  let cw,ch,cols,rows,balls=[],sparks=[];
  function size(){
    cv.width=innerWidth;cv.height=innerHeight;g.font=`${FS}px ${css.getPropertyValue('--mono')}`;
    g.textBaseline='top';cw=g.measureText('M').width;ch=FS*1.3;cols=Math.ceil(innerWidth/cw);rows=Math.ceil(innerHeight/ch);
    balls=Array.from({length:Math.max(6,Math.round(cols*rows/250))},()=>({x:Math.random()*cols,y:Math.random()*rows,
      vx:(Math.random()-.5)*0.5,vy:(Math.random()-.5)*0.3}));
  }
  function frame(){
    g.clearRect(0,0,cv.width,cv.height);g.globalAlpha=0.8;g.fillStyle=C[0];
    if(Math.random()<0.5)sparks.push({x:Math.random()*cols|0,y:Math.random()*rows|0,life:LIFE,c:C[Math.random()*3|0]});
    for(const b of balls){
      b.x=(b.x+b.vx+cols)%cols;b.y=(b.y+b.vy+rows)%rows;
      if(Math.random()<0.6)sparks.push({x:(b.x-Math.sign(b.vx)*(1+Math.random()*2))|0,y:(b.y+(Math.random()*3-1.5))|0,life:LIFE*2/3,c:C[1]});
      g.fillText('◉',(b.x|0)*cw,(b.y|0)*ch);
    }
    sparks=sparks.filter(s=>s.life-->0);
    for(const s of sparks){g.globalAlpha=0.25+0.6*s.life/LIFE;g.fillStyle=s.c;
      g.fillText(SPARK[SPARK.length-1-Math.min(SPARK.length-1,s.life/3|0)],s.x*cw,s.y*ch);}
    g.globalAlpha=1;
  }
  let rt;size();addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,150);}); // once the drag settles
  const btn=document.getElementById('bgToggle'),KEY='fm27counter.bg';
  let on=true;try{on=localStorage.getItem(KEY)!=='off';}catch{}
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches; // one still frame, no animation
  function apply(){
    btn.textContent=`Background animation: ${on?'on':'off'}`;btn.setAttribute('aria-pressed',on);
    if(on)for(let i=0;i<12;i++)frame(); // start with sparkles already out
    else g.clearRect(0,0,cv.width,cv.height);
  }
  btn.addEventListener('click',()=>{on=!on;try{localStorage.setItem(KEY,on?'on':'off');}catch{}apply();});
  apply();
  if(!still)setInterval(()=>{if(on&&!document.hidden)frame();},83);
})();
</script>
