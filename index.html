<style>

#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;max-width:1200px;margin:0 auto;padding:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
h1{font-size:15px;margin:0 0 12px;color:var(--accent)}
.ball{margin:0 auto 12px;width:max-content;font:700 11px/1 ui-monospace,monospace;color:var(--soft)}
.ball .h{color:var(--ink)}.ball .l{color:var(--muted)}.ball .p{color:var(--line)}
.ball *{pointer-events:none} /* frames replace these spans; hit-testing the <pre> keeps enter/leave reliable */
.ball .s{color:#fff8e0;text-shadow:0 0 4px #fff,0 0 8px var(--accent)}
h2{font-size:14px;margin:0 0 4px;color:var(--accent)}
h3{font-size:13px;margin:14px 0 4px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.box{border:1px solid var(--line);background:var(--bg-lift);padding:12px 14px}
label{display:block;margin:0 0 10px;color:var(--soft)}
select{display:block;width:100%;margin-top:3px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:4px;font:inherit}
/* Side panel: every dropdown is shown as a row of buttons (the hidden <select> still holds the value). */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chips button{border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--soft);padding:4px 8px;font-size:12px;line-height:1.3}
.chips button:hover{color:var(--ink);border-color:var(--soft)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips .br{flex-basis:100%;height:0} /* new row for the next back-line group */
.field{margin:0 0 14px;color:var(--soft)}
.field select{display:none}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{accent-color:var(--accent);margin-top:3px}
ul{margin:0;padding-left:18px}li{margin:2px 0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cols.two{grid-template-columns:repeat(2,1fr)}.cols.two>div{border:1px solid var(--line);background:var(--bg);padding:6px 12px}.cols.two h3{margin-top:4px}
@media(max-width:1000px){.cols,.cols.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:400}
.why{color:var(--muted)}.warn{color:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tab{flex:0 0 auto;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg);color:var(--soft);padding:6px 8px;margin-bottom:-1px;white-space:nowrap;font-size:12px}
.tab:hover{color:var(--ink)}
.planab{margin:0 0 2px;font-size:18px;font-weight:700;letter-spacing:.05em;color:var(--ink)}

.tabs.under .tab.on{border-color:var(--ink)}

.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tab.label{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;letter-spacing:.05em}
.box.tabbed{border-top-left-radius:0}
button{font:inherit;background:none;border:1px solid var(--line);color:var(--accent);padding:2px 8px;cursor:pointer}
.tag{color:var(--bg);background:var(--accent);padding:0 6px;margin-right:6px}
h3.big{font-size:16px;color:var(--accent);margin-top:0}
.oppo{font-size:20px;font-weight:700;letter-spacing:.06em;margin:0 0 10px}
.shape{border:1px solid var(--line);background:var(--bg);padding:6px 10px 12px;margin:4px 0 8px}
.shape span{display:block;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.shape b{font-size:18px;color:var(--accent)}

#out{display:grid;gap:16px;align-content:start;min-width:0}

    <option value="bus">Park the Bus</option></select></label>
  <label>Pressing intensity<select name="trigger"><option value="less">Less Often</option><option value="balanced" selected>Balanced</option><option value="more">More Often</option><option value="muchMore">Much More Often</option></select></label>
  <label>Their line of engagement<select name="engage"><option value="low">Low Block</option><option value="mid" selected>Mid Block</option><option value="high">High Press</option></select></label>

  <label>Home or away?<select name="venue"><option value="">Not sure</option><option value="home">Home</option><option value="away">Away</option></select></label>
  <div id="scout"></div>
</div>
</form>
<section id="out"></section>
</main>

  if(o.line==='lower'||o.line==='muchLower')add('bus',1,'Deep defensive line');
  if(highLine(o))add('possession',1,'High defensive line to play in behind');
  if(o.trigger==='more'||o.trigger==='muchMore')add('gegen',2,'Presses often: bypass it and run in behind');
  if(o.style==='unknown'&&o.mentality==='balanced')add('vtiki',1,'No clear style: mid block and counter is the safe default');
  return Object.entries(s).map(([k,r])=>({key:k,total:r.reduce((a,x)=>a+x[0],0),reasons:r.map(x=>x[1])}))
    .sort((a,b)=>b.total-a.total);
}
function recommend(o,force){
  const ranked=score(o);
  // A chosen playstyle always decides the plan; the scores only guess when it's 'Not sure'.
  let plan=force||(STYLE_NAME[o.style]?o.style:ranked[0].key);
  // Possession A or B: the sheet's rule of thumb (Work Rate + Stamina 14+ -> press; user adds Aggression), never press a stronger side.
  const fam=family(plan);
  if(AB[fam]&&(plan===fam||!force))plan=AB[fam][o.canPress&&o.strength!=='stronger'?1:0];
  const tweaks=TWEAKS.filter(t=>tweakOn(t,o));
  const shape=SHAPES[o.formation],oop=PLANS[plan].oop;
  const warns=[[oop,'plan'],[shape.oop,'shape counter']].filter(([f])=>MID[f]<shape.mid)
    .map(([f,w])=>`Count the middle: ${w} OOP ${f} has ${MID[f]} central players vs their ${shape.mid}`);
  const oopC=OOPS[o.oopShape]||null;
  // Layered lowest to highest; every override is reported.
  const layers=[['shape counter',oopC?.set],['plan',SETS[plan]],...tweaks.map(t=>[t.why,t.set])],set={},from={},clashes=[];
  for(const[who,s]of layers)for(const[k,v]of Object.entries(s||{})){
    if(k in set&&set[k]!==v)clashes.push(`${k}: ${v} (${who}) replaces ${set[k]} (${from[k]})`);
    set[k]=v;from[k]=who;
  }
  // Your shapes against them: attack their OOP shape (if known), defend against their IP shape.
  // Notes as dot points: one per clause of the sheet's reason.
  const dots=(head,why)=>[head,...why.split(/: |; |, /).map(x=>x.replace(/^and /,''))];
  const mine={ip:oopC?oopC.ip.split(' - ')[0]:shape.ip,ipWhy:oopC?dots(`vs their ${o.oopShape} out of possession`,oopC.ip.split(' - ')[1]||oopC.weak):dots(`vs their ${o.formation}`,shape.why),
    oop:shape.oop,oopWhy:dots(`vs their ${o.formation} in possession`,shape.why)};
  // Formation sheet: 4-4-1-1's weak spot is 'Wide men need high Work Rate'.
  if(mine.oop==='4-4-1-1'&&!o.canPress)warns.push("Your OOP 4-4-1-1: the wide men need high Work Rate (formation sheet) - without the legs, use 4-1-4-1 (the DM still screens their pivot)");
  const moodT=tweaks.filter(t=>t.mood);
  const m=PLAN_MOOD[plan]+moodT.reduce((n,t)=>n+t.mood,0);
  // Never Very Defensive before kick-off (user): it rarely gets a result; only late on, holding a lead or a player down.
  mine.mood=MOODS[Math.max(1,Math.min(6,m))];
  mine.moodWhy=[PLANS[plan].shape[0].replace(/,.*$/,''),...moodT.map(t=>`${t.why}: ${t.mood>0?'+':''}${t.mood}`),
    ...(m<1?['Very Defensive only late on when holding a lead or down to 10 men']:[])];
  return {plan,reasons:ranked.find(r=>r.key===plan).reasons,ranked,tweaks,shape,oop,warns,set,oopC,clashes,mine};
}

<script>
// Background: soccer balls drifting on a character grid, leaving sparkles. ~12fps for a terminal feel.
(()=>{
  const cv=document.getElementById('bg'),g=cv.getContext('2d'),css=getComputedStyle(document.documentElement);
  const C=['--ink','--accent','--cyan'].map(v=>css.getPropertyValue(v).trim());
  const SPARK=['*','×','+','·'],FS=14,LIFE=SPARK.length*3;
  let cw,ch,cols,rows,balls=[],sparks=[];
  function size(){
    cv.width=innerWidth;cv.height=innerHeight;g.font=`${FS}px ${css.getPropertyValue('--mono')}`;
    g.textBaseline='top';cw=g.measureText('M').width;ch=FS*1.3;cols=Math.ceil(innerWidth/cw);rows=Math.ceil(innerHeight/ch);
    balls=Array.from({length:Math.max(6,Math.round(cols*rows/250))},()=>({x:Math.random()*cols,y:Math.random()*rows,
      vx:(Math.random()-.5)*0.5,vy:(Math.random()-.5)*0.3}));
  }
  function frame(){
    g.clearRect(0,0,cv.width,cv.height);g.globalAlpha=0.8;g.fillStyle=C[0];
    if(Math.random()<0.5)sparks.push({x:Math.random()*cols|0,y:Math.random()*rows|0,life:LIFE,c:C[Math.random()*3|0]});
    for(const b of balls){
      b.x=(b.x+b.vx+cols)%cols;b.y=(b.y+b.vy+rows)%rows;
      if(Math.random()<0.6)sparks.push({x:(b.x-Math.sign(b.vx)*(1+Math.random()*2))|0,y:(b.y+(Math.random()*3-1.5))|0,life:LIFE*2/3,c:C[1]});
      g.fillText('◉',(b.x|0)*cw,(b.y|0)*ch);
    }
    sparks=sparks.filter(s=>s.life-->0);
    for(const s of sparks){g.globalAlpha=0.25+0.6*s.life/LIFE;g.fillStyle=s.c;
      g.fillText(SPARK[SPARK.length-1-Math.min(SPARK.length-1,s.life/3|0)],s.x*cw,s.y*ch);}
    g.globalAlpha=1;
  }
  let rt;size();addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,150);}); // once the drag settles
  const btn=document.getElementById('bgToggle'),KEY='fm27counter.bg';
  let on=true;try{on=localStorage.getItem(KEY)!=='off';}catch{}
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches; // one still frame, no animation
  function apply(){
    btn.textContent=`Background animation: ${on?'on':'off'}`;btn.setAttribute('aria-pressed',on);
    if(on)for(let i=0;i<12;i++)frame(); // start with sparkles already out
    else g.clearRect(0,0,cv.width,cv.height);
  }
  btn.addEventListener('click',()=>{on=!on;try{localStorage.setItem(KEY,on?'on':'off');}catch{}apply();});
  apply();
  if(!still)setInterval(()=>{if(on&&!document.hidden)frame();},83);
})();

<script>
// Spinning ASCII football, drawn like donut.c (same idea as the bean on recipes.okayok.coffee):
// a sphere sampled, spun, projected and z-buffered; the 12 pentagon patches sit at an icosahedron's vertices.
(()=>{
  const BW=30,BH=15,SHADE='.,-~:;=!*#$@',el=document.getElementById('ball');
  const g=(1+Math.sqrt(5))/2,V=[];
  for(const a of[-1,1])for(const b of[-g,g])V.push([0,a,b],[a,b,0],[b,0,a]);
  for(const v of V){const n=Math.hypot(...v);v[0]/=n;v[1]/=n;v[2]/=n;}
  const TWINKLE='.+*+.'; // a sparkle's life, one character per two frames (as on the coffee bean)
  function frame(spin,sparkles){
    const lum=new Array(BW*BH).fill(null),zb=new Float32Array(BW*BH);
    const cA=Math.cos(spin),sA=Math.sin(spin),cT=Math.cos(.35),sT=Math.sin(.35),L=[-.4,.55,.73];
    for(let th=0;th<2*Math.PI;th+=.025)for(let ph=-Math.PI/2;ph<=Math.PI/2;ph+=.025){
      const x=Math.cos(ph)*Math.cos(th),y=Math.sin(ph),z=Math.cos(ph)*Math.sin(th);
      let near=0;for(const v of V)near=Math.max(near,x*v[0]+y*v[1]+z*v[2]);
      const x1=x*cA+z*sA,z1=-x*sA+z*cA,y2=y*cT-z1*sT,z2=y*sT+z1*cT; // spin, then tilt toward the viewer
      const ooz=1/(3-z2),px=Math.round(BW/2-.5+1.9*14*ooz*x1),py=Math.round(BH/2-.5-14*ooz*y2);
      if(px<0||px>=BW||py<0||py>=BH)continue;
      const i=py*BW+px;if(ooz<=zb[i])continue;zb[i]=ooz;
      lum[i]=[x1*L[0]+y2*L[1]+z2*L[2],near>.965]; // [light, on a pentagon patch]
    }
    let html='',run='',cls='';
    const flush=()=>{if(run)html+=cls?`<span class="${cls}">${run}</span>`:run;run='';};
    for(let r=0;r<BH;r++){
      for(let c=0;c<BW;c++){
        const v=lum[r*BW+c];let ch=' ',k='';
        const sp=!v&&sparkles?sparkles.get(r*BW+c):undefined;
        if(sp!==undefined){ch=TWINKLE[Math.min(TWINKLE.length-1,sp>>1)];k='s';}
        else if(v&&v[1]){ch=v[0]>.15?':':'.';k='p';} // pentagon patches read as dark panels
        else if(v){ch=SHADE[Math.max(0,Math.min(11,Math.floor((v[0]+.15)*9.5)))];k=v[0]>.55?'h':v[0]>.15?'m':'l';}
        if(k!==cls){flush();cls=k;}run+=ch;
      }
      flush();if(r<BH-1)html+='\n';
    }
    return html;
  }
  const still=matchMedia('(prefers-reduced-motion: reduce)');
  // Still until hovered; spins and twinkles stars around it only while the pointer is over it.
  let spin=.6,timer=null,sparkles=null;
  el.innerHTML=frame(spin);
  // Favicon: this first frame, characters and colours as on the page, shrunk onto a 64px canvas.
  try{
    const rows=[[]];
    const walk=(node,col)=>{for(const n of node.childNodes){
      if(n.nodeType===3){for(const ch of n.data)ch==='\n'?rows.push([]):rows.at(-1).push([ch,col]);}
      else walk(n,getComputedStyle(n).color);}};
    walk(el,getComputedStyle(el).color);
    const used=rows.flatMap((r,y)=>r.map(([ch],x)=>ch!==' '?[x,y]:null)).filter(Boolean);
    const x0=Math.min(...used.map(u=>u[0])),x1=Math.max(...used.map(u=>u[0])),y0=Math.min(...used.map(u=>u[1])),y1=Math.max(...used.map(u=>u[1]));
    const N=64,cw=.6,sz=N/Math.max((x1-x0+1)*cw,y1-y0+1),c=document.createElement('canvas');c.width=c.height=N;
    const g=c.getContext('2d');g.font=`900 ${sz*1.7}px ui-monospace,monospace`;g.textAlign='center';g.textBaseline='middle';
    const ox=(N-(x1-x0+1)*cw*sz)/2,oy=(N-(y1-y0+1)*sz)/2;
    rows.forEach((r,y)=>r.forEach(([ch,col],x)=>{if(ch===' ')return;g.fillStyle=col;g.fillText(ch,ox+(x-x0+.5)*cw*sz,oy+(y-y0+.5)*sz);}));
    const link=document.createElement('link');link.rel='icon';link.href=c.toDataURL();document.head.append(link);
  }catch{}
  el.addEventListener('pointerenter',()=>{if(still.matches||timer)return;sparkles=new Map();timer=setInterval(()=>{
    sparkles.forEach((age,i)=>age>=TWINKLE.length*2-1?sparkles.delete(i):sparkles.set(i,age+1));
    for(let n=0;n<2;n++)if(Math.random()<.6)sparkles.set(Math.floor(Math.random()*BW*BH),0);
    spin+=.09;el.innerHTML=frame(spin,sparkles);},70);});
  el.addEventListener('pointerleave',()=>{clearInterval(timer);timer=null;sparkles=null;el.innerHTML=frame(spin);});
})();
